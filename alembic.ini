# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, space-separated, or a list
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to write to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded
# during the 'revision' command, regardless of autogenerate
# version_locations = %(here)s/bar

# version path separator; defaults to 'os.pathsep'
# version_path_separator = :

# set to 'true' to enable database connection pooling
# sqlalchemy.pool_recycle = 3600

# database connection URL
sqlalchemy.url = ${DATABASE_URL}

[post_write_hooks]



[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
